<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoPro Blog Page</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="badge">GoPro Blog Page</p>
        <h1>GoPro Blog Engine</h1>
        <p>
          A tiny blog publishing backend that accepts article uploads and
          instantly displays them on a hosted blog page.
        </p>
        <div class="actions">
          <a href="/blog">Open Blog Page</a>
          <a href="/api/blog/articles" target="_blank" rel="noreferrer">View JSON API</a>
        </div>
        <div class="endpoint">
          <strong>Upload endpoint:</strong>
          <code>http://localhost:8787/api/blog/upload</code>
        </div>
      </section>
    </main>
  </body>
</html>
